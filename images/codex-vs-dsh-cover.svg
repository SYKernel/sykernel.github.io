<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b28"/>
      <stop offset="100%" stop-color="#1a1033"/>
    </linearGradient>
    <linearGradient id="codex" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10a37f"/>
      <stop offset="100%" stop-color="#1a7f64"/>
    </linearGradient>
    <linearGradient id="dsh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4d6bfe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 中线分割 -->
  <line x1="600" y1="80" x2="600" y2="480" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
  <text x="600" y="70" font-family="sans-serif" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="bold">VS</text>

  <!-- 左侧：工业战甲 (Codex) -->
  <g transform="translate(70, 120)">
    <text x="230" y="0" font-family="sans-serif" font-size="22" fill="#10a37f" text-anchor="middle" font-weight="bold">工业战甲</text>
    <text x="230" y="25" font-family="sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">OpenAI Codex Harness</text>

    <!-- 战甲轮廓 -->
    <g transform="translate(130, 50)">
      <!-- 头盔 -->
      <rect x="20" y="0" width="80" height="55" rx="12" fill="none" stroke="url(#codex)" stroke-width="3" filter="url(#glow)"/>
      <rect x="35" y="18" width="50" height="12" rx="3" fill="#10a37f" opacity="0.3"/>
      <line x1="60" y1="18" x2="60" y2="30" stroke="#10a37f" stroke-width="2"/>
      <!-- 胸甲 -->
      <path d="M 10 55 L 30 70 L 30 130 L 90 130 L 90 70 L 110 55 L 110 150 L 10 150 Z" fill="none" stroke="url(#codex)" stroke-width="3" filter="url(#glow)"/>
      <!-- 胸甲核心 -->
      <circle cx="60" cy="100" r="14" fill="none" stroke="#10a37f" stroke-width="2"/>
      <circle cx="60" cy="100" r="6" fill="#10a37f" opacity="0.8"/>
      <text x="60" y="104" font-family="monospace" font-size="8" fill="#0d1117" text-anchor="middle" font-weight="bold">LO</text>
      <!-- 肩甲 -->
      <rect x="-5" y="55" width="25" height="30" rx="6" fill="none" stroke="url(#codex)" stroke-width="2.5"/>
      <rect x="100" y="55" width="25" height="30" rx="6" fill="none" stroke="url(#codex)" stroke-width="2.5"/>
      <!-- 装甲板纹 -->
      <line x1="30" y1="80" x2="90" y2="80" stroke="#10a37f" stroke-width="1" opacity="0.4"/>
      <line x1="30" y1="110" x2="90" y2="110" stroke="#10a37f" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- 标签 -->
    <rect x="80" y="225" width="110" height="28" rx="14" fill="none" stroke="#10a37f" stroke-width="1.5"/>
    <text x="135" y="244" font-family="sans-serif" font-size="12" fill="#10a37f" text-anchor="middle">Apache-2.0</text>
    <rect x="200" y="225" width="100" height="28" rx="14" fill="none" stroke="#10a37f" stroke-width="1.5"/>
    <text x="250" y="244" font-family="sans-serif" font-size="12" fill="#10a37f" text-anchor="middle">生产级</text>

    <!-- 特征列表 -->
    <text x="0" y="280" font-family="sans-serif" font-size="12" fill="#9ca3af">• 整体式架构，App Server + JSON-RPC</text>
    <text x="0" y="302" font-family="sans-serif" font-size="12" fill="#9ca3af">• 模型与 Harness 协同训练</text>
    <text x="0" y="324" font-family="sans-serif" font-size="12" fill="#9ca3af">• 100万+ 开发者</text>
  </g>

  <!-- 右侧：乐高积木 (DeepSeek) -->
  <g transform="translate(670, 120)">
    <text x="230" y="0" font-family="sans-serif" font-size="22" fill="#4d6bfe" text-anchor="middle" font-weight="bold">乐高积木</text>
    <text x="230" y="25" font-family="sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">DeepSeek Harness</text>

    <!-- 积木堆 -->
    <g transform="translate(130, 50)">
      <!-- 底层积木 -->
      <rect x="0" y="100" width="120" height="50" rx="4" fill="none" stroke="url(#dsh)" stroke-width="3"/>
      <circle cx="20" cy="100" r="5" fill="#4d6bfe" opacity="0.7"/>
      <circle cx="40" cy="100" r="5" fill="#4d6bfe" opacity="0.7"/>
      <circle cx="60" cy="100" r="5" fill="#4d6bfe" opacity="0.7"/>
      <circle cx="80" cy="100" r="5" fill="#4d6bfe" opacity="0.7"/>
      <circle cx="100" cy="100" r="5" fill="#4d6bfe" opacity="0.7"/>
      <text x="60" y="130" font-family="monospace" font-size="10" fill="#4d6bfe" text-anchor="middle">Loop</text>

      <!-- 中层积木 -->
      <rect x="15" y="55" width="90" height="45" rx="4" fill="none" stroke="url(#dsh)" stroke-width="3"/>
      <circle cx="35" cy="55" r="5" fill="#6366f1" opacity="0.7"/>
      <circle cx="55" cy="55" r="5" fill="#6366f1" opacity="0.7"/>
      <circle cx="75" cy="55" r="5" fill="#6366f1" opacity="0.7"/>
      <text x="60" y="82" font-family="monospace" font-size="10" fill="#6366f1" text-anchor="middle">Tools</text>

      <!-- 顶层积木 -->
      <rect x="30" y="10" width="60" height="45" rx="4" fill="none" stroke="url(#dsh)" stroke-width="3" filter="url(#glow)"/>
      <circle cx="45" cy="10" r="5" fill="#4d6bfe" opacity="0.8"/>
      <circle cx="75" cy="10" r="5" fill="#4d6bfe" opacity="0.8"/>
      <text x="60" y="38" font-family="monospace" font-size="9" fill="#4d6bfe" text-anchor="middle">Model</text>

      <!-- 旁边可拆卸积木 -->
      <rect x="130" y="70" width="50" height="35" rx="4" fill="none" stroke="#4d6bfe" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
      <text x="155" y="92" font-family="monospace" font-size="8" fill="#4d6bfe" text-anchor="middle" opacity="0.7">Sandbox</text>
      <rect x="130" y="110" width="50" height="35" rx="4" fill="none" stroke="#4d6bfe" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
      <text x="155" y="132" font-family="monospace" font-size="8" fill="#4d6bfe" text-anchor="middle" opacity="0.7">UI</text>
    </g>

    <!-- 标签 -->
    <rect x="80" y="225" width="80" height="28" rx="14" fill="none" stroke="#4d6bfe" stroke-width="1.5"/>
    <text x="120" y="244" font-family="sans-serif" font-size="12" fill="#4d6bfe" text-anchor="middle">MIT</text>
    <rect x="170" y="225" width="140" height="28" rx="14" fill="none" stroke="#4d6bfe" stroke-width="1.5"/>
    <text x="240" y="244" font-family="sans-serif" font-size="12" fill="#4d6bfe" text-anchor="middle">Developer Preview</text>

    <!-- 特征列表 -->
    <text x="0" y="280" font-family="sans-serif" font-size="12" fill="#9ca3af">• 微内核 + Cordis，万物皆插件</text>
    <text x="0" y="302" font-family="sans-serif" font-size="12" fill="#9ca3af">• 模型无关，任意可替换</text>
    <text x="0" y="324" font-family="sans-serif" font-size="12" fill="#9ca3af">• 成本低 30-100 倍</text>
  </g>

  <!-- 底部公式 -->
  <text x="600" y="540" font-family="monospace" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">Agent = Model + Harness</text>
  <text x="600" y="565" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">同样的公式，截然不同的工程哲学</text>

  <!-- 底部署名 -->
  <text x="600" y="600" font-family="sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">枢影Kernel · Focus On Android</text>

  <!-- 底部装饰线 -->
  <rect x="0" y="620" width="600" height="10" fill="url(#codex)" opacity="0.8"/>
  <rect x="600" y="620" width="600" height="10" fill="url(#dsh)" opacity="0.8"/>
</svg>
