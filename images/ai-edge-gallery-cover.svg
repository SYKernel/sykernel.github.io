<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0d1f2d"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="model" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea4335"/>
      <stop offset="100%" stop-color="#fbbc04"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 装饰网格 -->
  <g opacity="0.05" stroke="#4285f4" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- 左侧：三层架构示意 -->
  <g transform="translate(80, 140)">
    <!-- 顶层 Gallery App -->
    <rect x="0" y="0" width="240" height="65" rx="10" fill="none" stroke="url(#edge)" stroke-width="2.5"/>
    <text x="120" y="28" font-family="sans-serif" font-size="14" fill="#00d4aa" text-anchor="middle" font-weight="bold">Gallery App</text>
    <text x="120" y="48" font-family="monospace" font-size="11" fill="#9ca3af" text-anchor="middle">Kotlin · Compose · MVVM</text>

    <!-- 连接线 -->
    <line x1="120" y1="65" x2="120" y2="90" stroke="#4285f4" stroke-width="2"/>

    <!-- 中层 LiteRT-LM -->
    <rect x="0" y="90" width="240" height="65" rx="10" fill="none" stroke="url(#edge)" stroke-width="2.5"/>
    <text x="120" y="118" font-family="sans-serif" font-size="14" fill="#4285f4" text-anchor="middle" font-weight="bold">LiteRT-LM</text>
    <text x="120" y="138" font-family="monospace" font-size="11" fill="#9ca3af" text-anchor="middle">编排层 · 会话 · KV Cache</text>

    <!-- 连接线 -->
    <line x1="120" y1="155" x2="120" y2="180" stroke="#4285f4" stroke-width="2"/>

    <!-- 底层 LiteRT -->
    <rect x="0" y="180" width="240" height="65" rx="10" fill="none" stroke="url(#edge)" stroke-width="2.5"/>
    <text x="120" y="208" font-family="sans-serif" font-size="14" fill="#4285f4" text-anchor="middle" font-weight="bold">LiteRT</text>
    <text x="120" y="228" font-family="monospace" font-size="11" fill="#9ca3af" text-anchor="middle">推理引擎 · GPU/NPU</text>
  </g>

  <!-- 中间箭头 -->
  <g transform="translate(340, 240)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#00d4aa" stroke-width="2.5" stroke-dasharray="6 3"/>
    <polygon points="50,-7 64,0 50,7" fill="#00d4aa"/>
  </g>

  <!-- 右侧：手机+模型图标 -->
  <g transform="translate(420, 130)">
    <!-- 手机轮廓 -->
    <rect x="0" y="0" width="120" height="220" rx="16" fill="none" stroke="url(#model)" stroke-width="3" filter="url(#glow)"/>
    <!-- 听筒 -->
    <rect x="45" y="8" width="30" height="4" rx="2" fill="#666"/>
    <!-- 屏幕内容：模型运行波纹 -->
    <circle cx="60" cy="70" r="22" fill="none" stroke="#ea4335" stroke-width="2" opacity="0.8"/>
    <circle cx="60" cy="70" r="14" fill="none" stroke="#fbbc04" stroke-width="2" opacity="0.6"/>
    <circle cx="60" cy="70" r="6" fill="#ea4335" opacity="0.9"/>
    <text x="60" y="74" font-family="sans-serif" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">AI</text>
    <!-- 对话线条 -->
    <rect x="20" y="110" width="60" height="8" rx="4" fill="#4285f4" opacity="0.5"/>
    <rect x="35" y="128" width="70" height="8" rx="4" fill="#00d4aa" opacity="0.5"/>
    <rect x="20" y="146" width="50" height="8" rx="4" fill="#4285f4" opacity="0.4"/>
    <rect x="40" y="164" width="65" height="8" rx="4" fill="#00d4aa" opacity="0.4"/>
    <!-- Home indicator -->
    <rect x="40" y="200" width="40" height="3" rx="1.5" fill="#666"/>
  </g>

  <!-- 主标题区 -->
  <text x="600" y="220" font-family="sans-serif" font-size="52" fill="#ffffff" font-weight="bold">AI Edge Gallery</text>
  <text x="600" y="270" font-family="sans-serif" font-size="28" fill="#00d4aa" font-weight="600">架构深度解析</text>
  <text x="600" y="305" font-family="sans-serif" font-size="20" fill="#9ca3af">生产级端侧 AI 应用的完整参考实现</text>

  <!-- 底部标签 -->
  <g transform="translate(600, 345)">
    <rect x="0" y="0" width="110" height="34" rx="17" fill="none" stroke="#4285f4" stroke-width="1.5"/>
    <text x="55" y="22" font-family="sans-serif" font-size="14" fill="#4285f4" text-anchor="middle" font-weight="600">LiteRT-LM</text>
    <rect x="125" y="0" width="90" height="34" rx="17" fill="none" stroke="#ea4335" stroke-width="1.5"/>
    <text x="170" y="22" font-family="sans-serif" font-size="14" fill="#ea4335" text-anchor="middle" font-weight="600">Gemma 4</text>
    <rect x="230" y="0" width="70" height="34" rx="17" fill="none" stroke="#fbbc04" stroke-width="1.5"/>
    <text x="265" y="22" font-family="sans-serif" font-size="14" fill="#fbbc04" text-anchor="middle" font-weight="600">MCP</text>
  </g>

  <!-- 底部署名 -->
  <text x="600" y="560" font-family="sans-serif" font-size="16" fill="#6b7280">枢影Kernel · Focus On Android</text>

  <!-- 底部装饰线 -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#edge)" opacity="0.8"/>
</svg>
