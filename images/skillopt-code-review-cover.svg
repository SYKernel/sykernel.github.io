<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#16121f"/>
      <stop offset="100%" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="600" y="96" font-family="sans-serif" font-size="38" fill="#ffffff" text-anchor="middle" font-weight="bold">从手写 SKILL.md 到自动训练</text>
  <text x="600" y="136" font-family="sans-serif" font-size="19" fill="#9ca3af" text-anchor="middle">用 SkillOpt 优化一个代码评审技能</text>

  <!-- 左：手写文档 -->
  <g filter="url(#glow)">
    <rect x="105" y="205" width="250" height="210" rx="12" fill="#0d1f2d" stroke="#6b7280" stroke-width="2.5"/>
  </g>
  <rect x="135" y="235" width="130" height="16" rx="4" fill="#4b5563"/>
  <rect x="135" y="265" width="190" height="8" rx="4" fill="#374151"/>
  <rect x="135" y="283" width="170" height="8" rx="4" fill="#374151"/>
  <rect x="135" y="301" width="190" height="8" rx="4" fill="#374151"/>
  <rect x="135" y="319" width="140" height="8" rx="4" fill="#374151"/>
  <text x="230" y="372" font-family="monospace" font-size="16" fill="#e5e7eb" text-anchor="middle" font-weight="bold">手写 SKILL.md</text>
  <text x="230" y="396" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">拍脑袋 · 无验证 · 不敢改</text>

  <!-- 左→中箭头 -->
  <line x1="365" y1="310" x2="428" y2="310" stroke="url(#accent)" stroke-width="3"/>
  <polygon points="428,303 442,310 428,317" fill="#22c55e"/>

  <!-- 中：训练循环 -->
  <g>
    <circle cx="600" cy="310" r="92" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="14 8"/>
    <circle cx="600" cy="218" r="24" fill="#0d1f2d" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="600" y="224" font-family="sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="bold">Rollout</text>
    <circle cx="683" cy="264" r="24" fill="#0d1f2d" stroke="#22c55e" stroke-width="2.5"/>
    <text x="683" y="270" font-family="sans-serif" font-size="11" fill="#22c55e" text-anchor="middle" font-weight="bold">Reflect</text>
    <circle cx="683" cy="356" r="24" fill="#0d1f2d" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="683" y="362" font-family="sans-serif" font-size="10.5" fill="#a78bfa" text-anchor="middle" font-weight="bold">Select</text>
    <circle cx="600" cy="402" r="24" fill="#0d1f2d" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="600" y="408" font-family="sans-serif" font-size="10.5" fill="#a78bfa" text-anchor="middle" font-weight="bold">Update</text>
    <circle cx="517" cy="356" r="24" fill="#0d1f2d" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="517" y="362" font-family="sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold">Gate</text>
    <circle cx="517" cy="264" r="24" fill="#0d1f2d" stroke="#22c55e" stroke-width="2.5"/>
    <text x="517" y="270" font-family="sans-serif" font-size="10.5" fill="#22c55e" text-anchor="middle" font-weight="bold">Edit</text>
    <text x="600" y="316" font-family="sans-serif" font-size="14" fill="#e5e7eb" text-anchor="middle" font-weight="bold">SkillOpt</text>
    <text x="600" y="336" font-family="sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">文本空间训练</text>
  </g>

  <!-- 中→右箭头 -->
  <line x1="702" y1="310" x2="765" y2="310" stroke="url(#accent)" stroke-width="3"/>
  <polygon points="765,303 779,310 765,317" fill="#38bdf8"/>

  <!-- 右：产物 -->
  <g filter="url(#glow)">
    <rect x="845" y="205" width="250" height="210" rx="12" fill="#0d1f2d" stroke="#22c55e" stroke-width="2.5"/>
  </g>
  <rect x="875" y="235" width="150" height="16" rx="4" fill="#22c55e" fill-opacity="0.55"/>
  <rect x="875" y="265" width="190" height="8" rx="4" fill="#374151"/>
  <rect x="875" y="283" width="160" height="8" rx="4" fill="#374151"/>
  <rect x="875" y="301" width="190" height="8" rx="4" fill="#374151"/>
  <text x="970" y="372" font-family="monospace" font-size="16" fill="#22c55e" text-anchor="middle" font-weight="bold">best_skill.md</text>
  <text x="970" y="396" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">验证门控 · 可审计 · 可迁移</text>

  <!-- 底部数据条 -->
  <g>
    <rect x="140" y="470" width="280" height="52" rx="26" fill="#111827" stroke="#22c55e" stroke-width="1.5"/>
    <text x="280" y="503" font-family="sans-serif" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="bold">GPT-5.5 直连 +23.5 分</text>
    <rect x="460" y="470" width="280" height="52" rx="26" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="600" y="503" font-family="sans-serif" font-size="15" fill="#38bdf8" text-anchor="middle" font-weight="bold">52/52 评测格最优或并列</text>
    <rect x="780" y="470" width="280" height="52" rx="26" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="920" y="503" font-family="sans-serif" font-size="15" fill="#a78bfa" text-anchor="middle" font-weight="bold">产物 379~1995 token</text>
  </g>

  <text x="600" y="576" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Microsoft Research · arXiv:2605.23904 · github.com/microsoft/SkillOpt</text>
</svg>
