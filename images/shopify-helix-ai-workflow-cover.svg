<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#12101f"/>
      <stop offset="100%" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="600" y="96" font-family="sans-serif" font-size="40" fill="#ffffff" text-anchor="middle" font-weight="bold">Shopify Helix AI 工作流详解</text>
  <text x="600" y="136" font-family="sans-serif" font-size="19" fill="#9ca3af" text-anchor="middle">小检查点 × 四道质量门 · 驱动 300+ 屏 App 迁回原生</text>

  <!-- 左：React Native 参考屏 -->
  <g filter="url(#glow)">
    <rect x="105" y="205" width="250" height="210" rx="12" fill="#0d1f2d" stroke="#6b7280" stroke-width="2.5"/>
  </g>
  <rect x="135" y="235" width="130" height="16" rx="4" fill="#4b5563"/>
  <rect x="135" y="265" width="190" height="8" rx="4" fill="#374151"/>
  <rect x="135" y="283" width="170" height="8" rx="4" fill="#374151"/>
  <rect x="135" y="301" width="190" height="8" rx="4" fill="#374151"/>
  <text x="230" y="372" font-family="monospace" font-size="16" fill="#e5e7eb" text-anchor="middle" font-weight="bold">React Native 屏</text>
  <text x="230" y="396" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">参考实现 · 本身就是规格</text>

  <!-- 左→中箭头 -->
  <line x1="365" y1="310" x2="428" y2="310" stroke="url(#accent)" stroke-width="3"/>
  <polygon points="428,303 442,310 428,317" fill="#f59e0b"/>

  <!-- 中：Helix 循环 -->
  <g>
    <circle cx="600" cy="310" r="100" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="14 8"/>
    <circle cx="600" cy="216" r="26" fill="#0d1f2d" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="600" y="213" font-family="sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="bold">行为</text>
    <text x="600" y="227" font-family="sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">CLI 测试</text>
    <circle cx="688" cy="310" r="26" fill="#0d1f2d" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="688" y="307" font-family="sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold">UI 评审</text>
    <text x="688" y="321" font-family="sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">Gemini</text>
    <circle cx="600" cy="404" r="26" fill="#0d1f2d" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="600" y="401" font-family="sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="bold">对抗×2</text>
    <text x="600" y="415" font-family="sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">隔离评审</text>
    <circle cx="512" cy="310" r="26" fill="#0d1f2d" stroke="#22c55e" stroke-width="2.5"/>
    <text x="512" y="307" font-family="sans-serif" font-size="11" fill="#22c55e" text-anchor="middle" font-weight="bold">工程师</text>
    <text x="512" y="321" font-family="sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">收口</text>
    <text x="600" y="305" font-family="sans-serif" font-size="15" fill="#e5e7eb" text-anchor="middle" font-weight="bold">Helix 循环</text>
    <text x="600" y="327" font-family="sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">收敛而非一次成型</text>
  </g>

  <!-- 中→右箭头 -->
  <line x1="708" y1="310" x2="771" y2="310" stroke="url(#accent)" stroke-width="3"/>
  <polygon points="771,303 785,310 771,317" fill="#38bdf8"/>

  <!-- 右：原生屏 -->
  <g filter="url(#glow)">
    <rect x="845" y="205" width="250" height="210" rx="12" fill="#0d1f2d" stroke="#22c55e" stroke-width="2.5"/>
  </g>
  <rect x="875" y="235" width="150" height="16" rx="4" fill="#22c55e" fill-opacity="0.55"/>
  <rect x="875" y="265" width="190" height="8" rx="4" fill="#374151"/>
  <rect x="875" y="283" width="160" height="8" rx="4" fill="#374151"/>
  <text x="970" y="372" font-family="monospace" font-size="16" fill="#22c55e" text-anchor="middle" font-weight="bold">原生 Swift / Kotlin</text>
  <text x="970" y="396" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">UI ≈ 1:1 · 行为已证明</text>

  <!-- 底部数据条 -->
  <g>
    <rect x="140" y="470" width="280" height="52" rx="26" fill="#111827" stroke="#22c55e" stroke-width="1.5"/>
    <text x="280" y="503" font-family="sans-serif" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="bold">Shop：12 周 POC → 上架</text>
    <rect x="460" y="470" width="280" height="52" rx="26" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="600" y="503" font-family="sans-serif" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="bold">四道门 · 可重试 不可跳过</text>
    <rect x="780" y="470" width="280" height="52" rx="26" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="920" y="503" font-family="sans-serif" font-size="15" fill="#38bdf8" text-anchor="middle" font-weight="bold">冷启动 iOS −23% · Android −50%</text>
  </g>

  <text x="600" y="576" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Shopify Engineering · back-to-native / shop-app-migration / helix · 2026-09</text>
</svg>
