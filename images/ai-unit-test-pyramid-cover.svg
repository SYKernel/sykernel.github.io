<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#12211c"/>
      <stop offset="100%" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="unit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="integ" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="ui" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="600" y="92" font-family="sans-serif" font-size="36" fill="#ffffff" text-anchor="middle" font-weight="bold">AI 生成的单元测试</text>
  <text x="600" y="132" font-family="sans-serif" font-size="18" fill="#9ca3af" text-anchor="middle">70% 业务逻辑 + 20% 集成 + 10% UI 的测试金字塔落地指南</text>

  <!-- 金字塔：顶层 10% UI -->
  <polygon points="600,182 634,238 566,238" fill="#a78bfa" fill-opacity="0.14" stroke="url(#ui)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- 中层 20% 集成 -->
  <polygon points="566,238 634,238 712,326 488,326" fill="#38bdf8" fill-opacity="0.12" stroke="url(#integ)" stroke-width="2.5"/>
  <!-- 底层 70% 业务逻辑 -->
  <polygon points="488,326 712,326 908,540 292,540" fill="#22c55e" fill-opacity="0.10" stroke="url(#unit)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- 金字塔内部百分比 -->
  <text x="600" y="226" font-family="monospace" font-size="15" fill="#c4b5fd" text-anchor="middle" font-weight="bold">10%</text>
  <text x="600" y="290" font-family="monospace" font-size="16" fill="#7dd3fc" text-anchor="middle" font-weight="bold">20%</text>
  <text x="600" y="430" font-family="monospace" font-size="26" fill="#4ade80" text-anchor="middle" font-weight="bold">70%</text>

  <!-- 左侧标注：测试类型 -->
  <text x="240" y="222" font-family="sans-serif" font-size="16" fill="#a78bfa" text-anchor="end" font-weight="bold">UI 测试</text>
  <line x1="250" y1="217" x2="568" y2="212" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="240" y="300" font-family="sans-serif" font-size="16" fill="#38bdf8" text-anchor="end" font-weight="bold">集成测试</text>
  <line x1="250" y1="295" x2="490" y2="285" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="240" y="420" font-family="sans-serif" font-size="20" fill="#22c55e" text-anchor="end" font-weight="bold">业务逻辑单元测试</text>
  <line x1="250" y1="414" x2="500" y2="415" stroke="#22c55e" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- 右侧标注：AI 参与方式 -->
  <rect x="920" y="196" width="150" height="30" rx="15" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="995" y="216" font-family="sans-serif" font-size="13" fill="#a78bfa" text-anchor="middle">录制 + 关键路径</text>
  <line x1="636" y1="210" x2="916" y2="210" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <rect x="920" y="272" width="190" height="30" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="1015" y="292" font-family="sans-serif" font-size="13" fill="#38bdf8" text-anchor="middle">AI 起草 + 人补环境</text>
  <line x1="714" y1="286" x2="916" y2="286" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <rect x="920" y="398" width="150" height="30" rx="15" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <text x="995" y="418" font-family="sans-serif" font-size="13" fill="#22c55e" text-anchor="middle">AI 批量生成</text>
  <line x1="910" y1="413" x2="916" y2="413" stroke="#22c55e" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- 底部要点 -->
  <text x="600" y="580" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">AI 最擅长补的，恰好是金字塔的底座</text>
  <text x="600" y="604" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">枢影Kernel · Focus On Android</text>

  <!-- 底部装饰线 -->
  <rect x="0" y="620" width="400" height="10" fill="url(#unit)" opacity="0.8"/>
  <rect x="400" y="620" width="400" height="10" fill="url(#integ)" opacity="0.8"/>
  <rect x="800" y="620" width="400" height="10" fill="url(#ui)" opacity="0.8"/>
</svg>
