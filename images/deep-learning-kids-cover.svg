<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#101c2b"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="600" y="96" font-family="sans-serif" font-size="38" fill="#ffffff" text-anchor="middle" font-weight="bold">深度学习入门</text>
  <text x="600" y="136" font-family="sans-serif" font-size="19" fill="#9ca3af" text-anchor="middle">一篇让小孩子也能读懂的 AI 教程</text>

  <!-- 左：猫照片 -->
  <g filter="url(#glow)">
    <rect x="115" y="215" width="240" height="195" rx="14" fill="#0d1f2d" stroke="#f59e0b" stroke-width="2.5"/>
  </g>
  <circle cx="235" cy="295" r="46" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <polygon points="203,263 212,232 226,261" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <polygon points="267,261 281,232 290,263" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="219" cy="291" r="4.5" fill="#f59e0b"/>
  <circle cx="251" cy="291" r="4.5" fill="#f59e0b"/>
  <path d="M 219 313 Q 235 327 251 313" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <line x1="231" y1="309" x2="213" y2="327" stroke="#f59e0b" stroke-width="1.8"/>
  <line x1="239" y1="309" x2="257" y2="327" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="235" y="390" font-family="sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">这是猫吗？</text>

  <!-- 右：神经网络节点 -->
  <g filter="url(#glow)">
    <rect x="845" y="215" width="240" height="195" rx="14" fill="#0d1f2d" stroke="#38bdf8" stroke-width="2.5"/>
  </g>
  <line x1="885" y1="265" x2="965" y2="240" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="885" y1="265" x2="965" y2="305" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="885" y1="330" x2="965" y2="305" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="885" y1="330" x2="965" y2="370" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="965" y1="240" x2="1045" y2="285" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="965" y1="305" x2="1045" y2="285" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="965" y1="305" x2="1045" y2="350" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="965" y1="370" x2="1045" y2="350" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="885" cy="265" r="9" fill="#0d1117" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="885" cy="330" r="9" fill="#0d1117" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="965" cy="240" r="9" fill="#0d1117" stroke="#a78bfa" stroke-width="2.5"/>
  <circle cx="965" cy="305" r="9" fill="#0d1117" stroke="#a78bfa" stroke-width="2.5"/>
  <circle cx="965" cy="370" r="9" fill="#0d1117" stroke="#a78bfa" stroke-width="2.5"/>
  <circle cx="1045" cy="285" r="11" fill="#22c55e"/>
  <circle cx="1045" cy="350" r="11" fill="#0d1117" stroke="#22c55e" stroke-width="2.5"/>
  <text x="965" y="390" font-family="sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">是猫，92% 确定</text>

  <!-- 中：机器人老师 + 箭头 -->
  <line x1="365" y1="312" x2="440" y2="312" stroke="url(#accent)" stroke-width="3"/>
  <polygon points="440,305 454,312 440,319" fill="#22c55e"/>
  <line x1="746" y1="312" x2="821" y2="312" stroke="url(#accent)" stroke-width="3"/>
  <polygon points="821,305 835,312 821,319" fill="#f59e0b"/>

  <g>
    <rect x="525" y="228" width="150" height="120" rx="20" fill="#0d1f2d" stroke="#22c55e" stroke-width="3"/>
    <circle cx="570" cy="278" r="10" fill="#22c55e"/>
    <circle cx="630" cy="278" r="10" fill="#22c55e"/>
    <path d="M 565 315 Q 600 335 635 315" fill="none" stroke="#22c55e" stroke-width="3"/>
    <line x1="600" y1="228" x2="600" y2="200" stroke="#22c55e" stroke-width="3"/>
    <circle cx="600" cy="194" r="8" fill="#22c55e"/>
    <line x1="560" y1="348" x2="560" y2="368" stroke="#22c55e" stroke-width="3"/>
    <line x1="600" y1="348" x2="600" y2="372" stroke="#22c55e" stroke-width="3"/>
    <line x1="640" y1="348" x2="640" y2="368" stroke="#22c55e" stroke-width="3"/>
    <text x="600" y="398" font-family="sans-serif" font-size="14" fill="#e5e7eb" text-anchor="middle" font-weight="bold">深度学习</text>
  </g>

  <!-- 底部数据条 -->
  <g>
    <rect x="140" y="470" width="280" height="52" rx="26" fill="#111827" stroke="#22c55e" stroke-width="1.5"/>
    <text x="280" y="503" font-family="sans-serif" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="bold">不用写一行代码</text>
    <rect x="460" y="470" width="280" height="52" rx="26" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="600" y="503" font-family="sans-serif" font-size="15" fill="#38bdf8" text-anchor="middle" font-weight="bold">10 分钟动手实验</text>
    <rect x="780" y="470" width="280" height="52" rx="26" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="920" y="503" font-family="sans-serif" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="bold">适合亲子共读</text>
  </g>

  <text x="600" y="576" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">猜一猜 · 拧一拧 · 再猜 —— AI 就是这样变聪明的</text>
</svg>
